apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/eparrisbusiness1-93/devops-tech-challenge-2.git'
    targetRevision: gitops
    path: helm/hello-world-chart
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true