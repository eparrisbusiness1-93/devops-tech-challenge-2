replicaCount: 1

image:
  repository: 444896211196.dkr.ecr.us-east-2.amazonaws.com/hello-world-app
  tag: "df2908898428cc53c484426be6a19152eccbf609"
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 80
  targetPort: 3000

resources:
